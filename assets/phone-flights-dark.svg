<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 470" role="img" aria-label="Drawing of a phone: a row of dates and flight combinations sorted by price."><style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#E6EAF2}.soft{fill:#8D97A8}.b{font-weight:700}.a{animation-duration:10s;animation-iteration-count:infinite;animation-timing-function:ease-out;transform-box:fill-box}@media (prefers-reduced-motion:reduce){.a{animation:none}}.row{animation-name:row}@keyframes row{0%,8%{opacity:0;transform:translateY(10px)}18%,95%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}.pick{animation-name:pick}@keyframes pick{0%,52%{opacity:0}60%,95%{opacity:1}100%{opacity:0}}</style><rect x="8" y="8" width="224" height="454" rx="38" fill="none" stroke="#E6EAF2" stroke-width="2.5"/><rect x="92" y="22" width="56" height="14" rx="7" fill="#E6EAF2"/><text class="b" x="30" y="78" font-size="19">Flexible dates</text><rect x="30" y="96" width="22" height="30" rx="7" fill="none" stroke="#343D4D" stroke-width="1.5"/><text x="41" y="116" font-size="11" text-anchor="middle" class="soft">14</text><rect x="56" y="96" width="22" height="30" rx="7" fill="none" stroke="#343D4D" stroke-width="1.5"/><text x="67" y="116" font-size="11" text-anchor="middle" class="soft">15</text><rect x="82" y="96" width="22" height="30" rx="7" fill="#FFB84D"/><text x="93" y="116" font-size="11" text-anchor="middle" class="b" style="fill:#0D1117">16</text><rect x="108" y="96" width="22" height="30" rx="7" fill="none" stroke="#343D4D" stroke-width="1.5"/><text x="119" y="116" font-size="11" text-anchor="middle" class="soft">17</text><rect x="134" y="96" width="22" height="30" rx="7" fill="none" stroke="#343D4D" stroke-width="1.5"/><text x="145" y="116" font-size="11" text-anchor="middle" class="soft">18</text><rect x="160" y="96" width="22" height="30" rx="7" fill="#FFB84D"/><text x="171" y="116" font-size="11" text-anchor="middle" class="b"