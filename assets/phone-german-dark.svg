<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 470" role="img" aria-label="Drawing of a phone: a German fill-in-the-blank exercise and a vocabulary review card."><style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#E6EAF2}.soft{fill:#8D97A8}.b{font-weight:700}.a{animation-duration:10s;animation-iteration-count:infinite;animation-timing-function:ease-out;transform-box:fill-box}@media (prefers-reduced-motion:reduce){.a{animation:none}}.l0{animation-name:l0}@keyframes l0{0%,12%{opacity:0}12.01%,95%{opacity:1}100%{opacity:0}}.l1{animation-name:l1}@keyframes l1{0%,16%{opacity:0}16.01%,95%{opacity:1}100%{opacity:0}}.l2{animation-name:l2}@keyframes l2{0%,20%{opacity:0}20.01%,95%{opacity:1}100%{opacity:0}}.l3{animation-name:l3}@keyframes l3{0%,24%{opacity:0}24.01%,95%{opacity:1}100%{opacity:0}}.l4{animation-name:l4}@keyframes l4{0%,28%{opacity:0}28.01%,95%{opacity:1}100%{opacity:0}}.ok{transform-origin:center;animation-name:ok}@keyframes ok{0%,38%{opacity:0;transform:scale(.4)}44%,95%{opacity:1;transform:scale(1)}100%{opacity:0}}.good{animation-name:good}@keyframes good{0%,58%{opacity:0}64%,95%{opacity:1}100%{opacity:0}}</style><rect x="8" y="8" width="224" height="454" rx="38" fill="none" stroke="#E6EAF2" stroke-width="2.5"/><rect x="92" y="22" width="56" height="14" rx="7" fill="#E6EAF2"/><text class="soft" x="30" y="78" font-size="12">Exercise</text><text x="30" y="118" font-size="16">Ich</text><path d="M56,124h52" stroke="#8D97A8" stroke-width="1.5"/><text class="a b l0" x="61" y="118" font-size="16" style="fill:#FF6B9D">f</text><text class="a b l1" x="66.6" y="118" font-size="16" style="fill:#FF6B9D">a</text><text class="a b l2" x="75.8" y="118" font-size="16" style="fill:#FF6B9D">h</text><text class="a b l3" x="85.7" y="118" font-size="16" style="fill:#FF6B9D">r</text><text class="a b l4" x="92.3" y="118" font-size="16" style="fill:#FF6B9D">e</text><text x="114" y="118" font-size="16">mit dem</text><text x="30" y="144" font-size="16">Zug zur Arbeit.</text><g class="a ok"><circle cx="196" cy="138" r="11" fill="#7AA2FF"/><path d="M190.5,138.5l4,4l7,-8" fill="none" stroke="#0D1117" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><text class="soft" x="30" y="206" font-size="12">Review</text><rect x="30" y="220" width="180" height="150" rx="16" fill="none" stroke="#343D4D" stroke-width="1.5"/><text class="b" x="120" y="286" font-size="20" text-anchor="middle">der Bahnhof</text><text class="soft" x="120" y="312" font-size="13" text-anchor="middle">istasyon</text><rect x="30" y="394" width="40" height="26" rx="13" fill="none" stroke="#343D4D" stroke-width="1.5"/><text class="soft" x="50" y="411" font-size="10" text-anchor="middle">Again</text><rect x="76" y="394" width="40" height="26" rx="13" fill="none" stroke="#343D4D" stroke-width="1.5"/><text class="soft" x="96" y="411" font-size="10" text-anchor="middle">Hard</text><rect x="122" y="394" width="40" height="26" rx="13" fill="none" stroke="#343D4D" stroke-width="1.5"/><text class="soft" x="142" y="411" font-size="10" text-anchor="middle">Good</text><rect x="168" y="394" width="40" height="26" rx="13" fill="none" stroke="#343D4D" stroke-width="1.5"/><text class="soft" x="188" y="411" font-size="10" text-anchor="middle">Easy</text><rect class="a good" x="122" y="394" width="40" height="26" rx="13" fill="#7AA2FF"/><text class="a b good" x="142" y="411" font-size="10" text-anchor="middle" style="fill:#0D1117">Good</text></svg>
