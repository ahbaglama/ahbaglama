<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 470" role="img" aria-label="Drawing of a phone: a calorie ring, spending by category and a scanned receipt."><style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#1F2430}.soft{fill:#667085}.b{font-weight:700}.a{animation-duration:10s;animation-iteration-count:infinite;animation-timing-function:ease-out;transform-box:fill-box}@media (prefers-reduced-motion:reduce){.a{animation:none}}.ring{stroke-dasharray:263.89;stroke-dashoffset:84.45;animation-name:ring}@keyframes ring{0%,6%{stroke-dashoffset:263.89}26%,94%{stroke-dashoffset:84.45}100%{stroke-dashoffset:263.89}}.bar{transform-origin:left center;animation-name:bar}@keyframes bar{0%,10%{transform:scaleX(0)}32%,94%{transform:scaleX(1)}100%{transform:scaleX(0)}}</style><rect x="8" y="8" width="224" height="454" rx="38" fill="none" stroke="#1F2430" stroke-width="2.5"/><rect x="92" y="22" width="56" height="14" rx="7" fill="#1F2430"/><text class="b" x="30" y="78" font-size="19">This month</text><circle cx="120" cy="158" r="42" fill="none" stroke="#D5DAE3" stroke-width="10"/><g transform="rotate(-90 120 158)"><circle class="a ring" cx="120" cy="158" r="42" fill="none" stroke="#2F5BEA" stroke-width="10" stroke-linecap="round"/></g><text class="b" x="120" y="157" font-size="21" text-anchor="middle">68%</text><text class="soft" x="120" y="174" font-size="11" text-anchor="middle">of kcal goal</text><text class="soft" x="30" y="266" font-size="12">Home</text><rect x="30" y="273" width="180" height="8" rx="4" fill="#D5DAE3"/><rect class="a bar" x="30" y="273" width="150" height="8" rx="4" fill="#2F5BEA" style="animation-delay:0s"/><text class="soft" x="30" y="306" font-size="12">Food</text><rect x="30" y="313" width="180" height="8" rx="4" fill="#D5DAE3"/><rect class="a bar" x="30" y="313" width="104" height="8" rx="4" fill="#D9820A" style="animation-delay:0.12s"/><text class="soft" x="30" y="346" font-size="12">Transport</text><rect x="30" y="353" width="180" height="8" rx="4" fill="#D5DAE3"/><rect class="a bar" x="30" y="353" width="62" height="8" rx="4" fill="#D6336C" style="animation-delay:0.24s"/><rect x="30" y="382" width="180" height="50" rx="12" fill="none" stroke="#D5DAE3" stroke-width="1.5"/><text class="b" x="44" y="404" font-size="13">Receipt scanned</text><text class="soft" x="44" y="421" font-size="11">4 items, sorted on device</text></svg>
